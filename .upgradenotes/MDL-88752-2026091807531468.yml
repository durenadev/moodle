issueNumber: MDL-88752
notes:
  mod_quiz:
    - message: >-
        The `slotheading` field is now included in the question data returned by
        the `mod_quiz_get_attempt_data`, `mod_quiz_get_attempt_summary` and
        `mod_quiz_get_attempt_review` web services. It contains the quiz section
        heading preceding the question, or an empty string when there is no
        heading.
      type: changed
